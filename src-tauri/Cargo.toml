[package]
name = "videolecture2notes"
version = "0.10.0"
description = "A macOS app for turning lecture videos into structured notes"
authors = ["SaitomTech"]
license = "MIT"
repository = "https://github.com/SaitomTech/VideoLecture2Notes"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sha2 = "0.10"
futures-util = "0.3"
keyring = { version = "3.6.3", features = ["apple-native"] }
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }
