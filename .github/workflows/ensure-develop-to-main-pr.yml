name: Ensure Develop To Main PR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ensure-develop-to-main-pr
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-pr:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build PR metadata
        id: meta
        run: |
          export TZ=Asia/Tokyo
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Ensure PR exists
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.meta.outputs.date }} Production merge
        run: |
          pr_number=$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number')

          body=$(cat <<'EOF'
          ## 概要
          `develop` の内容を `main` へ反映するための自動生成PRです。
          EOF
          )

          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "$TITLE" \
              --body "$body"
            exit 0
          fi

          gh pr edit "$pr_number" \
            --title "$TITLE" \
            --body "$body"
